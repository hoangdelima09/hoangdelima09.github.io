<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2530"/>
      <stop offset="1" stop-color="#17181c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- ROC axes -->
  <line x1="110" y1="440" x2="440" y2="440" stroke="#9a9ba3" stroke-width="3"/>
  <line x1="110" y1="440" x2="110" y2="120" stroke="#9a9ba3" stroke-width="3"/>
  <line x1="110" y1="440" x2="440" y2="120" stroke="#6b6c75" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M110 440 C 140 300, 220 200, 440 120" fill="none" stroke="#ffd36e" stroke-width="5"/>
  <path d="M110 440 C 150 330, 240 240, 440 120" fill="none" stroke="#7e8bd6" stroke-width="3"/>
  <text x="250" y="475" fill="#c9c9cf" font-size="15">False positive rate</text>
  <text x="70" y="300" fill="#c9c9cf" font-size="15" transform="rotate(-90 70 300)">True positive rate</text>
  <!-- legend -->
  <rect x="500" y="170" width="24" height="6" fill="#ffd36e"/>
  <text x="535" y="180" fill="#ffffff" font-size="18">XGBoost  AUC 0.742</text>
  <rect x="500" y="215" width="24" height="6" fill="#7e8bd6"/>
  <text x="535" y="225" fill="#c9c9cf" font-size="18">Decision Tree  AUC 0.716</text>
  <!-- bars -->
  <g fill="#ffd36e" opacity="0.85">
    <rect x="510" y="380" width="34" height="60" rx="3"/>
    <rect x="560" y="340" width="34" height="100" rx="3"/>
    <rect x="610" y="300" width="34" height="140" rx="3"/>
    <rect x="660" y="360" width="34" height="80" rx="3"/>
  </g>
  <text x="510" y="470" fill="#c9c9cf" font-size="15">SHAP feature impact</text>
  <text x="30" y="50" fill="#ffffff" font-size="26" font-weight="bold">Credit Risk · XGBoost</text>
  <text x="30" y="80" fill="#c9c9cf" font-size="17">600K+ Lending Club loans · SHAP · Streamlit</text>
</svg>
