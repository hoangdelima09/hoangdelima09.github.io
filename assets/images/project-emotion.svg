<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22232a"/>
      <stop offset="1" stop-color="#17181c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- face -->
  <ellipse cx="230" cy="275" rx="105" ry="128" fill="#f2c9a0"/>
  <ellipse cx="190" cy="250" rx="12" ry="14" fill="#2b2b2b"/>
  <ellipse cx="270" cy="250" rx="12" ry="14" fill="#2b2b2b"/>
  <path d="M170 228 q20 -14 40 -2 M250 226 q20 -12 40 2" stroke="#2b2b2b" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M180 320 q50 45 100 0" stroke="#8a3b2e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- detection box -->
  <rect x="110" y="135" width="240" height="285" fill="none" stroke="#ffd36e" stroke-width="4"/>
  <rect x="110" y="111" width="150" height="26" fill="#ffd36e"/>
  <text x="117" y="130" fill="#111" font-size="17" font-weight="bold">happy 0.87</text>
  <!-- probability bars -->
  <g font-size="16" fill="#c9c9cf">
    <text x="420" y="150">happy</text>    <rect x="520" y="136" width="220" height="18" rx="4" fill="#ffd36e"/>
    <text x="420" y="190">neutral</text>  <rect x="520" y="176" width="60" height="18" rx="4" fill="#6b6c75"/>
    <text x="420" y="230">surprise</text> <rect x="520" y="216" width="34" height="18" rx="4" fill="#6b6c75"/>
    <text x="420" y="270">sad</text>      <rect x="520" y="256" width="18" height="18" rx="4" fill="#6b6c75"/>
    <text x="420" y="310">angry</text>    <rect x="520" y="296" width="12" height="18" rx="4" fill="#6b6c75"/>
    <text x="420" y="350">fear</text>     <rect x="520" y="336" width="8" height="18" rx="4" fill="#6b6c75"/>
    <text x="420" y="390">disgust</text>  <rect x="520" y="376" width="6" height="18" rx="4" fill="#6b6c75"/>
  </g>
  <text x="30" y="50" fill="#ffffff" font-size="26" font-weight="bold">ResNet101 · RAF-DB</text>
  <text x="30" y="80" fill="#c9c9cf" font-size="17">7 emotion classes · 70.63% test accuracy</text>
</svg>
